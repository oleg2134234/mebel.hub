<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Демо: виджет чат-бота «Сытные угодья»</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 3rem 1.5rem; background: #f6f3ee; color: #2b271f; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  code { background: #efe6d6; padding: 0.1rem 0.4rem; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Демо-страница для локальной проверки виджета</h1>
  <p>Запустите бэкенд (<code>cd chatbot/server &amp;&amp; npm start</code>), затем откройте
     этот файл в браузере — в правом нижнем углу появится кнопка чата.</p>
  <p>Если бэкенд слушает не на <code>http://localhost:3001</code>, поправьте
     <code>data-api-url</code> у тега <code>&lt;script&gt;</code> ниже.</p>
</main>
<script src="./widget.js" data-api-url="http://localhost:3001/api/chat" async></script>
</body>
</html>
